[project]
name = "triage-demo"
version = "0.1.0"
description = "A small order-processing service used as a live target for ci-triage-agent."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
